[project]
name = "glzn"
version = "0.1.0"
description = "Small training, configuration, logging, and iTar data utilities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "numpydoc",
    "packaging",
    "pillow",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "scipy",
    "toml",
    "torch",
    "torchvision",
    "xxhash",
]

[project.optional-dependencies]
notebook = ["ipython", "ipywidgets"]

[dependency-groups]
dev = [
    "pyright",
]

[tool.setuptools.packages.find]
include = ["glzn*"]
exclude = ["rsc*", "tests*"]

[tool.setuptools.package-data]
"glzn.data" = ["_imgbrowser.html"]

[tool.pyright]
include = ["glzn", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
