[project]
name = "glzn"
version = "0.1.1"
description = "Small training, configuration, logging, and iTar data utilities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "numpydoc",
    "packaging",
    "pillow",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "scipy",
    "toml",
    "torch",
    "torchvision",
    "xxhash",
]

[project.optional-dependencies]
blosc2 = ["blosc2>=4.4.3"]
htj2k = ["blosc2>=4.4.3", "blosc2-htj2k>=0.4.2"]
jxl = ["pyjpegxl>=0.3.0"]
notebook = ["ipython", "ipywidgets"]
seismic = ["seismic-zfp>=0.5"]
video = ["torch>=2.11", "torchcodec>=0.17"]

[dependency-groups]
dev = [
    "pyright",
]

[tool.setuptools.packages.find]
include = ["glzn*"]
exclude = ["rsc*", "tests*"]

[tool.setuptools.package-data]
"glzn.data" = ["_imgbrowser.html"]

[tool.pyright]
include = ["glzn", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
